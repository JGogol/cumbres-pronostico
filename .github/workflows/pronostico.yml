name: Pronóstico diario

on:
  schedule:
    - cron: '0 8 * * *'    # 05:00 hora de Mendoza
    - cron: '0 20 * * *'   # 17:00 hora de Mendoza (actualiza para "mañana")
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python pronostico.py
      - name: Guardar historial de datos
        run: |
          git config user.name "cumbres-bot"
          git config user.email "cumbres-bot@users.noreply.github.com"
          git add historial
          git commit -m "Historial $(date -u +%Y-%m-%dT%H:%M)" || echo "sin cambios"
          git pull --rebase -q || true
          git push || echo "no se pudo subir el historial"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
